# EXAMPLE FRAGMENT ONLY — merge jobs into the current app spec, never replace it.
# Do not apply yet: applying a SCHEDULED job activates it.
# Confirm repository, deployment branch and instance selection against the app.
# Schema checked against DigitalOcean's App Specification reference, 2026-10-28.
jobs:
  - name: daily-notifications
    kind: SCHEDULED
    schedule:
      cron: "0 8 * * *"
      time_zone: Europe/London
    github:
      repo: REPLACE_OWNER/REPLACE_REPOSITORY
      branch: REPLACE_DEPLOYMENT_BRANCH
      deploy_on_push: false
    source_dir: pennywise-backend
    environment_slug: node-js
    build_command: npm ci --include=dev && npm run build
    run_command: npm run notifications:daily
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb # EXAMPLE: confirm availability/size.
    envs:
      - key: TZ
        scope: RUN_TIME
        value: Europe/London
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: fatal
    # Inherit/configure these through the host; never put secret values here:
    # DATABASE_URL (database binding/secret), TRUELAYER_CLIENT_ID,
    # TRUELAYER_CLIENT_SECRET (secret), TRUELAYER_REDIRECT_URI,
    # TRUELAYER_AUTH_URL, TRUELAYER_API_URL (same environment as the API),
    # VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY (secret), VAPID_SUBJECT.
    # Keep devDependencies installed: the existing logger imports pino-pretty.
    # DATABASE_URL must also be available during build for Prisma config loading.
